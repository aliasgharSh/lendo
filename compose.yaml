services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: lendo-php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - lendo-network
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    container_name: lendo-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - lendo-network

  mysql:
    image: mysql:8.4
    container_name: lendo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lendo}
      MYSQL_USER: ${DB_USERNAME:-lendo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lendo_local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lendo-network

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: lendo-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_password}
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lendo-network

networks:
  lendo-network:
    driver: bridge

volumes:
  mysql_data:
